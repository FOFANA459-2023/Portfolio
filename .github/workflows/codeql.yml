name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Rules are added to the query pack after code is written, so a weekly run
    # finds things that did not exist as findings when the code was merged.
    - cron: '0 7 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # Adds the queries GitHub leaves out of the default set: they are
          # noisier, which is the correct trade for a repository this size.
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'

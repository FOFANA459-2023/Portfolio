name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Advisories are published against dependencies that have not changed, so the
  # audit job needs a reason to run on a repository nobody has touched.
  schedule:
    - cron: '0 6 * * 1'

# A second push to the same branch makes the first one irrelevant. Cancelling
# it frees the runner instead of paying for a result nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. Any job that needs more asks for it itself.
permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # --------------------------------------------------------------------------
  # Everything that only needs the source. Fast, and first to fail.
  # --------------------------------------------------------------------------
  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # `ci` not `install`: it installs exactly what the lockfile says and
      # fails if package.json and the lockfile disagree, which is the whole
      # point of committing a lockfile.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # --------------------------------------------------------------------------
  # The artefact every later job uses, built once rather than three times.
  # --------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Report bundle size
        run: |
          echo "### Bundle" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -h -d 1 dist | sort -h >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # --------------------------------------------------------------------------
  # End-to-end and accessibility, against the built site rather than the dev
  # server, because the built site is what gets deployed.
  # --------------------------------------------------------------------------
  e2e:
    name: End-to-end and accessibility
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Cached by version, so a run only pays the 100MB download when the
      # Playwright version in the lockfile actually changes.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install browsers
        run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install system dependencies
        run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # --------------------------------------------------------------------------
  # Supply chain and secrets.
  # --------------------------------------------------------------------------
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Gitleaks diffs the history, so it needs the history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The one thing a build cannot catch: a secret that made it into the
      # bundle. Vite inlines every VITE_* variable, so this is the tripwire for
      # someone naming a private key VITE_SOMETHING.
      - name: Build and check the bundle for secrets
        run: |
          npm run build
          if grep -rIEq "sk_(test|live)_|service_role|whsec_|-----BEGIN [A-Z ]*PRIVATE KEY-----|AIza[0-9A-Za-z_-]{35}" dist/; then
            echo "::error::A credential pattern was found in the built bundle."
            exit 1
          fi
          echo "No credential patterns in dist/."

  # --------------------------------------------------------------------------
  # The mailer image. Built on every change so a broken Dockerfile is caught
  # here, and published only from main.
  # --------------------------------------------------------------------------
  docker:
    name: Mailer image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/contact-mailer
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

      # A built image that will not start is not a passing build. This proves
      # the entrypoint runs, the fail-closed checks work, and the health
      # endpoint answers, before anything is published.
      - name: Smoke test the image
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)

          echo "It must refuse to start without an origin allowlist:"
          if docker run --rm -e GMAIL_USER=a@b.com -e GMAIL_APP_PASSWORD=x "$IMAGE"; then
            echo "::error::The mailer started without ALLOWED_ORIGINS."
            exit 1
          fi

          echo "It must refuse a wildcard allowlist:"
          if docker run --rm -e GMAIL_USER=a@b.com -e GMAIL_APP_PASSWORD=x -e ALLOWED_ORIGINS='*' "$IMAGE"; then
            echo "::error::The mailer accepted ALLOWED_ORIGINS=*."
            exit 1
          fi

          echo "It must answer /healthz when configured:"
          docker run -d --name mailer -p 8787:8787 \
            -e GMAIL_USER=a@b.com -e GMAIL_APP_PASSWORD=x \
            -e ALLOWED_ORIGINS=https://example.com "$IMAGE"
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8787/healthz; then ok=1; break; fi
            sleep 1
          done
          docker logs mailer
          docker rm -f mailer
          test "$ok" = "1" || { echo "::error::/healthz never answered."; exit 1; }

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Advisories are published against dependencies that have not changed, so the
  # security job needs a reason to run on a repository nobody has touched.
  schedule:
    - cron: '0 6 * * 1'

# A second push to the same branch makes the first one irrelevant. Cancelling
# it frees the runner instead of paying for a result nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. Any job that needs more asks for it itself.
permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # --------------------------------------------------------------------------
  # Everything that only needs the source. Fast, and first to fail.
  # --------------------------------------------------------------------------
  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # `ci` not `install`: it installs exactly what the lockfile says and
      # fails if package.json and the lockfile disagree, which is the whole
      # point of committing a lockfile.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm run test:coverage

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # --------------------------------------------------------------------------
  # Reads the Playwright version out of the lockfile so the container tag that
  # runs the tests can never drift from the package that writes them. A whole
  # job rather than a step, because `container:` is resolved before any step in
  # a job gets to run.
  # --------------------------------------------------------------------------
  versions:
    name: Resolve versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      playwright: ${{ steps.pw.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: pw
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Playwright ${version}"

  # --------------------------------------------------------------------------
  # The artefact every later job uses, built once rather than three times.
  # --------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Report bundle size
        run: |
          {
            echo '### Bundle'
            echo '```'
            du -h -d 1 dist | sort -h
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  # --------------------------------------------------------------------------
  # End-to-end and accessibility, against the built site rather than the dev
  # server, because the built site is what gets deployed.
  # --------------------------------------------------------------------------
  e2e:
    name: End-to-end and accessibility
    needs: [versions, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The official image, tagged to match the lockfile exactly. The browser and
    # every system library it links against are already inside it, so this job
    # runs no apt at all.
    #
    # That is the point. `playwright install --with-deps` shells out to
    # `apt-get update`, and the hosted runner image carries a Google Chrome apt
    # source that periodically serves an index whose hash does not match its
    # Release file. When that happens the job dies on a repository this project
    # neither uses nor can fix. Nothing here depends on it any more.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.versions.outputs.playwright }}-noble
      # Runs as the runner's own uid rather than root, so files written into
      # the workspace are owned by the user the later steps run as.
      options: --user 1001

    steps:
      - uses: actions/checkout@v7

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # --------------------------------------------------------------------------
  # Supply chain and secrets.
  # --------------------------------------------------------------------------
  security:
    name: Security
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Gitleaks walks the history, so it needs the history.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      # The binary rather than the action: gitleaks-action gates on a licence
      # for some account types and fails in ways that have nothing to do with
      # this repository. A pinned release does the same scan with one fewer
      # moving part and one fewer third party in the supply chain.
      - name: Scan history for secrets
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git . --redact --no-banner --exit-code 1

      # The one thing a build cannot catch: a secret that made it into the
      # bundle. Vite inlines every VITE_* variable, so this is the tripwire for
      # someone naming a private key VITE_SOMETHING. Run against the artefact
      # the build job produced, not a fresh build, so it checks the bytes that
      # would actually be deployed.
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Check the built bundle for credentials
        run: |
          if grep -rIEq "sk_(test|live)_|service_role|whsec_|-----BEGIN [A-Z ]*PRIVATE KEY-----|AIza[0-9A-Za-z_-]{35}" dist/; then
            echo "::error::A credential pattern was found in the built bundle."
            grep -rIEn "sk_(test|live)_|service_role|whsec_|-----BEGIN [A-Z ]*PRIVATE KEY-----|AIza[0-9A-Za-z_-]{35}" dist/ | head -5
            exit 1
          fi
          echo "No credential patterns in dist/."

  # --------------------------------------------------------------------------
  # The mailer image. Built and proven before it is published, never after.
  # --------------------------------------------------------------------------
  docker:
    name: Mailer image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/contact-mailer
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      # Loaded into the local daemon and not pushed, so the smoke test below
      # runs against the exact image that would be published rather than
      # against something already public.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ./server
          load: true
          tags: contact-mailer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A built image that will not start is not a passing build. This proves
      # the fail-closed checks work and the health endpoint answers, before
      # anything is published.
      - name: Smoke test
        run: |
          set -euo pipefail
          IMAGE=contact-mailer:ci

          echo "::group::Refuses to start without an origin allowlist"
          if docker run --rm -e GMAIL_USER=a@b.com -e GMAIL_APP_PASSWORD=x "$IMAGE"; then
            echo "::error::The mailer started without ALLOWED_ORIGINS."
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Refuses a wildcard allowlist"
          if docker run --rm -e GMAIL_USER=a@b.com -e GMAIL_APP_PASSWORD=x \
               -e ALLOWED_ORIGINS='*' "$IMAGE"; then
            echo "::error::The mailer accepted ALLOWED_ORIGINS=*."
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Runs as a non-root user"
          test "$(docker run --rm --entrypoint id "$IMAGE" -u)" != "0"
          echo "::endgroup::"

          echo "::group::Answers /healthz and enforces the allowlist"
          docker run -d --name mailer -p 8787:8787 \
            -e GMAIL_USER=a@b.com -e GMAIL_APP_PASSWORD=x \
            -e ALLOWED_ORIGINS=https://example.com "$IMAGE"

          ok=0
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8787/healthz >/dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            docker logs mailer
            docker rm -f mailer
            echo "::error::/healthz never answered."
            exit 1
          fi

          BODY='{"name":"a","email":"a@b.com","message":"hello there"}'
          ENDPOINT=http://127.0.0.1:8787/api/contact

          no_origin=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d "$BODY" "$ENDPOINT")
          bad_origin=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -H 'Origin: https://evil.example' \
            -d "$BODY" "$ENDPOINT")

          docker rm -f mailer
          echo "no origin: ${no_origin}, wrong origin: ${bad_origin}"
          test "$no_origin" = "403"
          test "$bad_origin" = "403"
          echo "::endgroup::"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A cache hit, so nothing is rebuilt. This only tags and uploads the
      # layers the smoke test just passed.
      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # A deploy you cannot trigger by hand is a deploy you cannot roll forward
  # from at three in the morning.
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cloudflare:
    name: Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Only from a green CI run. `workflow_run` fires on failure too, so without
    # this the pipeline would cheerfully publish a build that failed its tests.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    # Gives the deployment a URL in the repository's Environments tab, and a
    # place to require an approval later without touching this file.
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Read from either a secret or a variable, because which box a value
      # belongs in is a judgement call and putting it in the other one should
      # not silently ship a site with no contact form. The Web3Forms key is a
      # public client-side identifier, so a variable is arguably the more
      # honest home for it; both work.
      - name: Resolve the contact route
        id: contact
        env:
          ENDPOINT: ${{ vars.VITE_CONTACT_ENDPOINT || secrets.VITE_CONTACT_ENDPOINT }}
          KEY: ${{ vars.VITE_WEB3FORMS_KEY || secrets.VITE_WEB3FORMS_KEY }}
        run: |
          if [ -n "$ENDPOINT" ]; then
            echo "route=the mailer in server/" >> "$GITHUB_OUTPUT"
          elif [ -n "$KEY" ]; then
            echo "route=Web3Forms" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Neither VITE_WEB3FORMS_KEY nor VITE_CONTACT_ENDPOINT is set, so this build would ship with no contact form. Add one under Settings, Secrets and variables, Actions. Either a secret or a variable is read."
            exit 1
          fi

      # Rebuilt rather than pulled from the CI run's artifact: an artifact is
      # addressed by run id and can be replaced, and the thing being published
      # should be built from the commit being deployed.
      - name: Build
        run: npm run build
        env:
          VITE_CONTACT_ENDPOINT: ${{ vars.VITE_CONTACT_ENDPOINT || secrets.VITE_CONTACT_ENDPOINT }}
          VITE_WEB3FORMS_KEY: ${{ vars.VITE_WEB3FORMS_KEY || secrets.VITE_WEB3FORMS_KEY }}

      # The guard above proves a value reached the workflow. This proves it
      # reached the bundle, which is a different claim: Vite only inlines a
      # variable that is present when it runs, and a deploy that quietly ships
      # an email address where a form should be is exactly the failure this
      # pipeline exists to catch.
      - name: Confirm the form is in the build
        run: |
          if grep -rq "Email is the fastest way to reach me" dist/assets/*.js; then
            echo "::error::The build fell back to an email address, so no delivery route was inlined. Check the name of the secret or variable."
            exit 1
          fi
          echo "Contact form present, delivering through ${{ steps.contact.outputs.route }}." >> "$GITHUB_STEP_SUMMARY"

      # v4 of the action, and the wrangler version named rather than defaulted.
      #
      # v3 installed wrangler 3.90.0, which predates Workers Static Assets
      # going GA: it does not understand `run_worker_first` and rejects a
      # compatibility_date newer than the runtime it shipped against. The
      # deploy failed on that alone, with wrangler's real error swallowed by
      # the action. An implicit default is what broke it, so there is no
      # implicit default here any more.
      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy

      # Not "did wrangler exit 0" but "is the site actually correct at its
      # public URL". A deploy that returns success and serves a 404, or serves
      # the page without its security headers, is a failed deploy.
      - name: Verify the deployment
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.deployment-url }}"
          test -n "$URL" || { echo "::error::No deployment URL was returned."; exit 1; }

          # A new Worker is not routable the instant the API returns success.
          # The first request after a fresh deploy is routinely a 404, and that
          # is propagation rather than a broken build, so this polls instead of
          # asserting on one attempt.
          echo "::group::Waiting for $URL"
          code=000
          for attempt in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL" || echo 000)
            echo "attempt ${attempt}: ${code}"
            [ "$code" = "200" ] && break
            sleep 5
          done
          echo "::endgroup::"
          if [ "$code" != "200" ]; then
            echo "::error::$URL did not serve 200 within two minutes (last status ${code})."
            exit 1
          fi

          echo "::group::Response headers"
          headers=$(curl -sSI "$URL")
          echo "$headers"
          echo "::endgroup::"

          for header in content-security-policy strict-transport-security x-content-type-options; do
            if ! grep -qi "^${header}:" <<<"$headers"; then
              echo "::error::$URL is missing the ${header} header."
              exit 1
            fi
          done

          # The resume is a link a recruiter clicks; a 404 there is worse than
          # a 404 anywhere else on the site.
          resume_type=$(curl -sS -o /dev/null -w '%{content_type}' "${URL%/}/Varlee-Fofana-Resume.pdf")
          case "$resume_type" in
            application/pdf*) ;;
            *) echo "::error::The resume served '${resume_type}' rather than a PDF."; exit 1 ;;
          esac

          {
            echo "### Deployed"
            echo ""
            echo "- ${URL}"
            echo "- Security headers present"
            echo "- Resume served as ${resume_type}"
          } >> "$GITHUB_STEP_SUMMARY"
